name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTENT_STAGE: p0
  FLUTTER_VERSION: 3.47.9
  RUST_VERSION: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          cache-on-failure: true

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --workspace --no-fail-fast

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Enforce Rust coverage threshold
        working-directory: rust
        run: |
          rustup component add llvm-tools-preview --toolchain "$RUST_VERSION"
          cargo llvm-cov \
            -p jp_core \
            --ignore-filename-regex frb_generated \
            --fail-under-lines 80

      - name: Test repository tools
        run: |
          python3 -m unittest discover -s tools/fonts
          python3 -m unittest discover -s tools/licenses
          python3 tools/licenses/make_rust_crates.py --check

  flutter:
    name: Flutter quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          shared-key: flutter-tests
          cache-on-failure: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install FRB code-generation tools
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install cargo-expand
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-expand@1.0.127

      - name: Check generated FFI bindings
        env:
          RUST_LOG: info
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
          generated_status="$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs)"
          if [[ -n "${generated_status}" ]]; then
            printf '%s\n' "Generated FFI bindings contain untracked files:" "${generated_status}"
            exit 1
          fi

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Enforce Dart import boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          material_import = re.compile(
              r"^\s*(?:import|export)\s+['\"]package:flutter/material\.dart['\"]"
          )
          generated_import = re.compile(
              r"^\s*(?:import|export)\s+['\"][^'\"]*src/rust(?:/|['\"])"
          )
          violations = []

          for path in sorted(Path("lib").rglob("*.dart")):
              relative = path.as_posix()
              rust_allowed = (
                  relative == "lib/bootstrap.dart"
                  or relative.startswith("lib/core/backend/frb/")
                  or relative.startswith("lib/src/rust/")
              )
              for number, line in enumerate(path.read_text().splitlines(), start=1):
                  if material_import.match(line):
                      violations.append(
                          f"{relative}:{number}: import material_ui instead of flutter/material.dart"
                      )
                  if not rust_allowed and generated_import.match(line):
                      violations.append(
                          f"{relative}:{number}: generated Rust bindings may only be imported "
                          "from core/backend/frb (bootstrap.dart is the sole exception)"
                      )

          if violations:
              print("Dart import boundary violations:")
              print("\n".join(violations))
              raise SystemExit(1)
          PY

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build Rust library for FFI tests
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Run Flutter and FFI tests with coverage
        run: flutter test --no-pub --coverage --exclude-tags golden

      - name: Enforce Flutter coverage threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path

          covered = total = 0
          source = None
          for line in Path("coverage/lcov.info").read_text().splitlines():
              if line.startswith("SF:"):
                  source = line[3:].replace("\\", "/")
              elif line.startswith("DA:") and source and "/lib/src/rust/" not in f"/{source}":
                  total += 1
                  covered += int(line[3:].split(",", 1)[1]) > 0

          percentage = covered * 100 / total if total else 0
          print(f"Flutter line coverage: {covered}/{total} ({percentage:.2f}%)")
          if percentage < 90:
              raise SystemExit("Flutter line coverage is below 90%")
          PY

      - name: Run golden tests
        run: flutter test --no-pub --tags golden

      - name: Check offline policy statically
        run: python3 tools/verify/check_offline.py

  content:
    name: Content verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          shared-key: content-verification
          cache-on-failure: true

      - name: Cache locked verification data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .verify-cache
          key: verify-${{ runner.os }}-${{ hashFiles('tools/verify/data.lock.toml') }}

      - name: Fetch locked verification data
        run: bash tools/verify/fetch_data.sh

      - name: Test content lint rules
        run: cargo test --manifest-path rust/Cargo.toml -p jp_content --test content_lint

      - name: Lint p0 content
        run: cargo run --release --manifest-path rust/Cargo.toml -p content_tool -- --stage p0 lint

      - name: Verify p0 content strictly
        run: cargo run --release --manifest-path rust/Cargo.toml -p content_tool -- --stage p0 verify --strict

      - name: Verify documented full-content fixture
        run: >-
          cargo run --release --manifest-path rust/Cargo.toml -p content_tool --
          verify
          --content-root rust/crates/jp_content/tests/fixtures/full
          --stage full
          --only J04,Z01,Z02,F01,F03

  android_apk:
    name: Build and verify Android APK
    needs: [rust, flutter, content]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'ci' }}
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
      version_name: ${{ steps.metadata.outputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK and NDK
        run: >-
          sdkmanager
          "platforms;android-35"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;3.22.1"
          "ndk;28.2.13676358"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" \
            armv7-linux-androideabi \
            aarch64-linux-android \
            x86_64-linux-android

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          shared-key: android-apk
          cache-on-failure: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure APK signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          keystore_path="$RUNNER_TEMP/android-upload-keystore.jks"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.example\.' \
              android/app/build.gradle.kts; then
              echo "Replace the placeholder com.example applicationId before publishing a tag." >&2
              exit 1
            fi

            if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || \
                  -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo "A v* tag requires all four ANDROID_KEYSTORE_* production environment secrets." >&2
              exit 1
            fi

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            keytool -list -keystore "$keystore_path" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            signing_mode=production
          else
            KEYSTORE_PASSWORD=ci-ephemeral-password
            KEY_PASSWORD=ci-ephemeral-password
            KEY_ALIAS=ci-ephemeral
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$keystore_path" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=CI, OU=CI, O=Japanese Learn App, L=Taipei, C=TW"
            signing_mode=ephemeral
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "mode=$signing_mode" >> "$GITHUB_OUTPUT"

      - name: Resolve APK version
        id: metadata
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            version_name="${BASH_REMATCH[1]}"
            IFS=. read -r major minor patch <<< "$version_name"
            if (( 10#$major > 2000 || 10#$minor > 999 || 10#$patch > 999 )); then
              echo "Release version components exceed the Android versionCode scheme." >&2
              exit 1
            fi
            build_number=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            if (( build_number < 1 )); then
              echo "Android versionCode must be at least 1." >&2
              exit 1
            fi
          else
            declared_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
            version_name="${declared_version%%+*}"
            build_number="$GITHUB_RUN_NUMBER"
          fi

          apk_name="japanese-learn-${version_name}-${build_number}-universal.apk"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build universal release APK
        run: >-
          flutter build apk
          --release
          --build-name "${{ steps.metadata.outputs.version_name }}"
          --build-number "${{ steps.metadata.outputs.build_number }}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH="
            echo "ANDROID_KEYSTORE_PASSWORD="
            echo "ANDROID_KEY_ALIAS="
            echo "ANDROID_KEY_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          verify --verbose
          build/app/outputs/flutter-apk/app-release.apk

      - name: Verify release APK is offline
        run: >-
          python3 tools/verify/check_offline.py
          --apk build/app/outputs/flutter-apk/app-release.apk
          --require-apk

      - name: Package APK and checksum
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  simulation:
    name: Release learning-loop simulations
    if: github.event_name != 'pull_request'
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          shared-key: release-simulations
          cache-on-failure: true

      - name: Run long learning-loop simulations
        run: |
          cargo test --manifest-path rust/Cargo.toml --release \
            --test p0_learning_loop -- --ignored
          cargo test --manifest-path rust/Cargo.toml --release \
            --test p0_learning_loop_edges -- --ignored

  integration:
    name: Linux end-to-end journeys
    if: github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Install Cargokit Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust -> target
          shared-key: integration-tests
          cache-on-failure: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Smoke-test Linux release bundle
        run: |
          set +e
          xvfb-run -a timeout 10 build/linux/x64/release/bundle/japanese_learn_app
          status=$?
          set -e
          if [[ $status -ne 124 ]]; then
            echo "Linux release exited unexpectedly with status $status." >&2
            exit 1
          fi

      - name: Run copy-policy unit tests
        run: >-
          flutter --show-test-device test
          integration_test/support/p0_copy_rules_test.dart
          -d flutter-tester

      - name: Run end-to-end journeys
        env:
          JLA_SHOTS_DIR: ${{ runner.temp }}/jla-shots
        run: |
          mkdir -p "$JLA_SHOTS_DIR"
          bash integration_test/run_all.sh

      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-screenshots
          path: ${{ runner.temp }}/jla-shots
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android_apk, simulation, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require production signing
        env:
          SIGNING_MODE: ${{ needs.android_apk.outputs.signing_mode }}
        run: |
          if [[ "$SIGNING_MODE" != "production" ]]; then
            echo "Refusing to publish an APK without production signing." >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
